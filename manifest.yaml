display_information:
  name: Project Intake
  description: Dynamic intake form for new team projects
  background_color: "#111113"

features:
  bot_user:
    display_name: Project Intake
    always_online: true
  slash_commands:
    - command: /new-project
      description: Start a new project intake
      should_escape: false
  shortcuts:
    - name: New project intake
      type: message
      callback_id: new_project_intake
      description: Open the project intake form

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public

settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
